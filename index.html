<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LWIHX · 个人站点</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="preload" as="image" href="./avatar.png">
</head>
<body>

    <div class="app-container fade-in">
        <header class="site-header">
            <div class="header-left">
                <img src="./avatar.png" alt="avatar" class="avatar-img" onerror="this.src='https://via.placeholder.com/48?text=Avatar'">
                <span class="site-title">LWIHX</span>
            </div>
            <div class="header-right">
                <a href="https://github.com/lwihx" target="_blank" rel="noopener noreferrer" class="github-link">Github</a>
            </div>
        </header>

        <nav class="main-nav">
            <button class="nav-btn active" data-tab="home">首页</button>
            <button class="nav-btn" data-tab="program">程序</button>
            <button class="nav-btn" data-tab="website">网站</button>
        </nav>

        <main class="tab-content-wrapper">
            <!-- 首页面板：左侧头像+信息，右侧Archive -->
            <div id="homePanel" class="tab-panel active-panel">
                <div class="home-layout">
                    <!-- 左侧：个人信息 -->
                    <div class="home-left">
                        <div class="home-profile">
                            <img src="./avatar.png" alt="avatar-large" class="home-avatar" onerror="this.src='https://via.placeholder.com/96?text=Avatar'">
                            <h2 class="home-name">LWIHX</h2>
                            <div class="home-github-mobile">
                                <a href="https://github.com/lwihx" target="_blank" rel="noopener noreferrer">@lwihx on GitHub</a>
                            </div>
                        </div>
                    </div>
                    <!-- 右侧：Archive 内容区域（直接读取 Archive.md） -->
                    <div class="home-right">
                        <div class="archive-card">
                            <div class="archive-header">
                                <span>📁 Archive</span>
                                <span class="archive-sub">Markdown 内容</span>
                            </div>
                            <div class="archive-content" id="archiveContent">
                                <div class="loading-placeholder">正在加载 Archive.md ...</div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 底部 LoliAPI 链接 -->
                <div class="home-footer">
                    <a href="https://www.loliapi.com/" target="_blank" rel="noopener noreferrer" class="loli-api-link">LoliAPI</a>
                </div>
            </div>

            <!-- 程序面板：硬编码文件列表，支持下载 -->
            <div id="programPanel" class="tab-panel">
                <div class="panel-header">
                    <h2>📦 Application</h2>
                    <p class="path-hint">点击文件名即可下载对应程序</p>
                </div>
                <div class="file-list-container" id="programFileList">
                    <div class="file-list-header">
                        <span>文件名称</span>
                        <span>日期</span>
                        <span>大小</span>
                    </div>
                    <div class="file-row">
                        <span class="file-name download-link" data-url="https://lwihx.github.io/files/JiYuTrainer-1.7.16.zip">📄 JiYuTrainer-1.7.16.zip</span>
                        <span class="file-date">2026-5-14</span>
                        <span class="file-size">4 MB</span>
                    </div>
                </div>
            </div>

            <!-- 网站面板：硬编码网站列表 -->
            <div id="websitePanel" class="tab-panel">
                <div class="panel-header">
                    <h2>🌐 Website</h2>
                    <p class="path-hint">收藏或展示的网站链接</p>
                </div>
                <div class="website-list-container" id="websiteList">
                    <div class="website-row">
                        <span class="website-name">🌐 <a href="https://www.loliapi.com/" target="_blank" rel="noopener" class="website-link">LoliAPI - 随机图片/API</a></span>
                        <span class="website-status">二次元与实用API</span>
                    </div>
                    <div class="website-row">
                        <span class="website-name">🌐 <a href="https://github.com/lwihx" target="_blank" rel="noopener" class="website-link">GitHub - LWIHX</a></span>
                        <span class="website-status">开源代码仓库</span>
                    </div>
                    <div class="website-row">
                        <span class="website-name">🌐 <a href="https://eo-img.iloli.love/i/pc/" target="_blank" rel="noopener" class="website-link">背景图源</a></span>
                        <span class="website-status">高清壁纸资源</span>
                    </div>
                    <div class="website-row">
                        <span class="website-name">🌐 <a href="https://developer.mozilla.org/zh-CN/" target="_blank" rel="noopener" class="website-link">MDN Web Docs</a></span>
                        <span class="website-status">前端技术文档</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="./index.js"></script>
</body>
</html>
